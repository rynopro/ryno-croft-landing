[build]
  # Static site — plain HTML/CSS/JS, no build step required.
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---------------------------------------------------------------------------
# Redirects from the old multi-page Astro site's routes to the new
# single-page layout, so any existing bookmarks, backlinks, or search
# results don't just 404.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/dental-cosmetic/*"
  to = "/#dental"
  status = 301

[[redirects]]
  from = "/luxury-realtors/*"
  to = "/#realestate"
  status = 301

[[redirects]]
  from = "/luxury-real-estate"
  to = "/#realestate"
  status = 301

[[redirects]]
  from = "/campaigns/*"
  to = "/#pricing"
  status = 301

[[redirects]]
  from = "/smes/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/sme-lead-nurture"
  to = "/"
  status = 301

[[redirects]]
  from = "/ecommerce-conversion/*"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# The Product Copy / ecommerce service has been discontinued (Sept 2026
# refocus). These pages have been removed from the repo, so the redirects
