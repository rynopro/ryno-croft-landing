[build]
  # Static site — plain HTML/CSS/JS, no build step required.
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---------------------------------------------------------------------------
# Redirects from the old multi-page Astro site's routes to the new
# single-page layout, so any existing bookmarks, backlinks, or search
# results don't just 404.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/dental-cosmetic/*"
  to = "/#dental"
  status = 301

